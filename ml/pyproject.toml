[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "employee-attrition-ml"
version = "0.1.0"
description = "Employee Attrition ML Package"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "catboost",
    "shap",
    "joblib"
]

[tool.setuptools]
packages = ["ml.src"]